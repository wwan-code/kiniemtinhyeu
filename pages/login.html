<!DOCTYPE html>
<html lang="vi" data-page="login" data-stage="0">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffeaf3">
  <title>Đăng nhập · Gửi em, người anh thương</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27><text y=%27.9em%27 font-size=%2790%27>💖</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&family=Quicksand:wght@500;600;700&display=swap">
  <link rel="stylesheet" href="../css/global.css">
  <link rel="stylesheet" href="../css/animations.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/pages/login.css">
  <script src="../js/config.js"></script>
  <script src="../js/navigation.js"></script>
</head>
<body>
  <div class="bg-scene" data-hearts="14" data-twinkles="16" aria-hidden="true">
    <i class="orb o1"></i><i class="orb o2"></i><i class="orb o3"></i>
  </div>

  <main class="page">
    <section class="login-card glass-card enter" style="--i:0" aria-labelledby="login-title">
      <div class="login-badge enter" style="--i:1" aria-hidden="true">
        <svg viewBox="0 0 120 120" class="login-badge__svg">
          <defs>
            <linearGradient id="lg-heart" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0" stop-color="#ffa6c4"/><stop offset="1" stop-color="#f5578a"/>
            </linearGradient>
          </defs>
          <path class="login-badge__heart" fill="url(#lg-heart)" d="M60 104 52.6 97.4C26.4 74 9 58.4 9 39.2 9 23.6 21.2 11.4 36.8 11.4c8.8 0 17.2 4.1 23.2 10.6 6-6.5 14.4-10.6 23.2-10.6C98.8 11.4 111 23.6 111 39.2c0 19.2-17.4 34.8-43.6 58.2L60 104z"/>
          <g class="login-badge__lock" fill="#fff">
            <rect x="44" y="48" width="32" height="26" rx="6"/>
            <path d="M50 48v-6a10 10 0 0 1 20 0v6" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round"/>
            <circle cx="60" cy="59" r="3.6" fill="#f5578a"/>
          </g>
        </svg>
      </div>

      <p class="eyebrow enter" style="--i:2" id="login-eyebrow"></p>
      <h1 class="title-xl enter" style="--i:3" id="login-title"></h1>
      <p class="lead login-message enter" style="--i:4" id="login-message"></p>

      <form class="login-form enter" style="--i:5" id="login-form" novalidate autocomplete="off">
        <div class="field">
          <label class="field__label" for="login-user" id="login-user-label"></label>
          <div class="field__control">
            <span class="field__icon" aria-hidden="true">🌷</span>
            <input class="input" id="login-user" name="username" type="text" inputmode="text" autocapitalize="none" autocorrect="off" spellcheck="false" autocomplete="username" required>
          </div>
        </div>
        <div class="field">
          <label class="field__label" for="login-pass" id="login-pass-label"></label>
          <div class="field__control">
            <span class="field__icon" aria-hidden="true">🔑</span>
            <input class="input input--with-toggle" id="login-pass" name="password" type="password" autocapitalize="none" autocorrect="off" spellcheck="false" autocomplete="current-password" required>
            <button class="field__toggle" type="button" id="login-toggle" aria-label="Hiện mật khẩu" aria-pressed="false">👁️</button>
          </div>
        </div>

        <p class="login-error" id="login-error" role="alert" aria-live="assertive"></p>

        <button class="btn btn--lg btn--glow login-submit" type="submit" id="login-submit"></button>
      </form>

      <p class="login-hint enter" style="--i:6" id="login-hint"></p>
    </section>
  </main>

  <div class="curtain" aria-hidden="true"><i class="heart-shape"></i></div>

  <script src="../js/effects.js"></script>
  <script src="../js/login.js"></script>
</body>
</html>
