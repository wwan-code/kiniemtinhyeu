<!DOCTYPE html>
<html lang="vi" data-page="quiz" data-stage="2">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffeaf3">
  <title>Thử thách tình yêu · Gửi em, người anh thương</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27><text y=%27.9em%27 font-size=%2790%27>💖</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&family=Quicksand:wght@500;600;700&display=swap">
  <link rel="stylesheet" href="../css/global.css">
  <link rel="stylesheet" href="../css/animations.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/pages/quiz.css">
  <script src="../js/config.js"></script>
  <script src="../js/navigation.js"></script>
</head>
<body>
  <div class="bg-scene" data-hearts="12" data-twinkles="14" aria-hidden="true">
    <i class="orb o1"></i><i class="orb o2"></i><i class="orb o3"></i>
  </div>

  <main class="page">
    <section class="quiz glass-card enter" style="--i:0" id="quiz" aria-live="polite">

      <!-- Màn giới thiệu -->
      <div class="quiz-screen quiz-intro" id="quiz-intro">
        <div class="quiz-emoji" aria-hidden="true">💝</div>
        <p class="eyebrow" id="quiz-eyebrow"></p>
        <h1 class="title-lg" id="quiz-title"></h1>
        <p class="lead" id="quiz-intro-text"></p>
        <button class="btn btn--lg btn--glow" type="button" id="quiz-start">Bắt đầu nào 💕</button>
      </div>

      <!-- Màn câu hỏi -->
      <div class="quiz-screen quiz-play" id="quiz-play" hidden>
        <header class="quiz-head">
          <div class="quiz-head__row">
            <span class="quiz-step" id="quiz-step"></span>
            <span class="quiz-topic" id="quiz-topic"></span>
          </div>
          <div class="progress" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" id="quiz-progress">
            <div class="progress__bar" id="quiz-progress-bar"></div>
          </div>
        </header>

        <div class="quiz-body" id="quiz-body">
          <h2 class="quiz-question" id="quiz-question" tabindex="-1"></h2>
          <div class="quiz-options" id="quiz-options" role="radiogroup" aria-labelledby="quiz-question"></div>
        </div>

        <footer class="quiz-foot">
          <button class="btn btn--ghost btn--sm" type="button" id="quiz-prev">← Câu trước</button>
          <button class="btn" type="button" id="quiz-next" disabled>Tiếp theo →</button>
        </footer>
      </div>

      <!-- Màn kết quả -->
      <div class="quiz-screen quiz-result" id="quiz-result" hidden>
        <div class="quiz-ring" id="quiz-ring">
          <svg viewBox="0 0 120 120" aria-hidden="true">
            <defs>
              <linearGradient id="ring-grad" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0" stop-color="#ffa6c4"/><stop offset="1" stop-color="#a98ff0"/>
              </linearGradient>
            </defs>
            <circle class="quiz-ring__track" cx="60" cy="60" r="52"/>
            <circle class="quiz-ring__bar" id="quiz-ring-bar" cx="60" cy="60" r="52" transform="rotate(-90 60 60)"/>
          </svg>
          <div class="quiz-ring__label"><strong id="quiz-percent">0%</strong><small id="quiz-score"></small></div>
        </div>
        <h2 class="title-lg" id="quiz-result-title"></h2>
        <p class="lead" id="quiz-result-text"></p>
        <button class="btn btn--lg" type="button" id="quiz-result-btn"></button>
      </div>
    </section>
  </main>

  <div class="curtain" aria-hidden="true"><i class="heart-shape"></i></div>

  <script src="../js/effects.js"></script>
  <script src="../js/quiz.js"></script>
</body>
</html>
