<!DOCTYPE html>
<html lang="vi" data-page="loading" data-stage="3">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffdde9">
  <title>Đang chuẩn bị quà… · Gửi em, người anh thương</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27><text y=%27.9em%27 font-size=%2790%27>💖</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&family=Quicksand:wght@500;600;700&display=swap">
  <link rel="stylesheet" href="../css/global.css">
  <link rel="stylesheet" href="../css/animations.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/pages/loading.css">
  <script src="../js/config.js"></script>
  <script src="../js/navigation.js"></script>
</head>
<body class="ld-body">
  <div class="bg-scene" data-hearts="18" data-twinkles="22" aria-hidden="true">
    <i class="orb o1"></i><i class="orb o2"></i><i class="orb o3"></i>
  </div>

  <main class="page">
    <section class="ld enter" style="--i:0" aria-labelledby="ld-label">

      <!-- Thanh loading phong cách "heart balloons" -->
      <div class="ld-track" id="ld-track">
        <span class="ld-balloon" data-at="0"  style="--at:4%"  aria-hidden="true"><svg viewBox="0 0 48 60"><use href="#ld-heart"/></svg></span>
        <span class="ld-balloon" data-at="50" style="--at:50%" aria-hidden="true"><svg viewBox="0 0 48 60"><use href="#ld-heart"/></svg></span>
        <span class="ld-balloon" data-at="100" style="--at:96%" aria-hidden="true"><svg viewBox="0 0 48 60"><use href="#ld-heart"/></svg></span>

        <span class="ld-like" id="ld-like" aria-hidden="true">
          <svg viewBox="0 0 24 24"><path fill="#fff" d="M12 20.4l-1.1-1C6.4 15.4 3.6 12.9 3.6 9.8c0-2.5 2-4.5 4.5-4.5 1.4 0 2.8.7 3.9 1.9 1.1-1.2 2.5-1.9 3.9-1.9 2.5 0 4.5 2 4.5 4.5 0 3.1-2.8 5.6-7.3 9.6l-1.1 1z"/></svg>
        </span>

        <div class="ld-bar" id="ld-bar" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" aria-labelledby="ld-label">
          <div class="ld-bar__fill" id="ld-fill">
            <span class="ld-bar__text ld-bar__text--on" id="ld-text-on" aria-hidden="true">0%</span>
          </div>
          <span class="ld-bar__text" id="ld-text">0%</span>
        </div>
      </div>

      <p class="ld-label" id="ld-label"><span id="ld-title"></span><span class="ld-dots" aria-hidden="true"><i>.</i><i>.</i><i>.</i></span></p>
      <p class="ld-message" id="ld-message" role="status" aria-live="polite"></p>

      <div class="ld-cta" id="ld-cta" hidden>
        <span class="ld-hand" aria-hidden="true">👉</span>
        <button class="btn btn--lg btn--glow ld-click" type="button" id="ld-click"></button>
      </div>
    </section>

    <!-- Hình trái tim dùng lại cho các "bóng bay" -->
    <svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
      <defs>
        <g id="ld-heart">
          <line x1="24" y1="30" x2="24" y2="58" stroke="#4a2a3a" stroke-width="3" stroke-linecap="round"/>
          <path d="M24 31.5 21.4 29.2C11.6 20.6 5 14.8 5 8.6 5 4.6 8.2 1.6 12.2 1.6c2.4 0 4.8 1.1 6.4 3.1L24 8.4l5.4-3.7c1.6-2 4-3.1 6.4-3.1 4 0 7.2 3 7.2 7C43 14.8 36.4 20.6 26.6 29.2L24 31.5z" fill="#ff8087" stroke="#4a2a3a" stroke-width="3" stroke-linejoin="round" transform="translate(0 2)"/>
          <path d="M11 9.5c0-2.2 1.6-3.8 3.6-3.8" fill="none" stroke="#fff" stroke-opacity=".7" stroke-width="2.4" stroke-linecap="round" transform="translate(0 2)"/>
        </g>
      </defs>
    </svg>
  </main>

  <div class="curtain" aria-hidden="true"><i class="heart-shape"></i></div>

  <script src="../js/effects.js"></script>
  <script src="../js/loading.js"></script>
</body>
</html>
